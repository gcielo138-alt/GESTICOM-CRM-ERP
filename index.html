
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GESTICOM | CRM & ERP</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="layout">

    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">G</div>
            <div>
                <h2>GESTICOM</h2>
                <small>CRM & ERP SYSTEM</small>
            </div>
        </div>

        <div class="menu-label">GENERAL</div>
        <button class="nav active" data-page="dashboard">▦ Dashboard</button>

        <div class="menu-label">CRM</div>
        <button class="nav" data-page="clients">♙ Clientes</button>
        <button class="nav" data-page="opportunities">◎ Oportunidades</button>

        <div class="menu-label">ERP</div>
        <button class="nav" data-page="products">▣ Inventario</button>
        <button class="nav" data-page="suppliers">♧ Proveedores</button>
        <button class="nav" data-page="sales">↗ Ventas</button>
        <button class="nav" data-page="purchases">↙ Compras</button>

        <div class="menu-label">ANÁLISIS</div>
        <button class="nav" data-page="reports">▤ Reportes</button>

        <div class="sidebar-footer">
            <span>●</span> Sistema operativo
            <small>GESTICOM v1.0</small>
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <div>
                <h3 id="page-title">Dashboard</h3>
                <small>Gestión empresarial integrada</small>
            </div>

            <div class="user">
                <div class="avatar">AD</div>
                <div>
                    <strong>Administrador</strong>
                    <small>Usuario principal</small>
                </div>
            </div>
        </header>

        <section id="content" class="content"></section>
    </main>
</div>

<div id="modal" class="modal hidden">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="modal-title">Registrar información</h3>
            <button class="close" onclick="closeModal()">×</button>
        </div>

        <form id="data-form">
            <div id="form-fields" class="form-fields"></div>

            <div class="modal-actions">
                <button type="button" class="btn-secondary"
                    onclick="closeModal()">Cancelar</button>
                <button type="submit" class="btn-primary">
                    Guardar información
                </button>
            </div>
        </form>
    </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>

</body>
</html>
